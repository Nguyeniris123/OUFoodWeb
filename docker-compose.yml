  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oufoodweb
    restart: unless-stopped
    command:  >
      gunicorn -b 0.0.0.0:8000
      --workers 4
      --access-logfile -
      --error-logfile -
      --log-level info
      --capture-output
      app.index:app

    ports:
      - "127.0.0.1:8000:8000"

    env_file:
      - .env

    depends_on:
#      mysql:
#        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"



  phpmyadmin:
    image: phpmyadmin:latest
    container_name: oufoodweb_phpmyadmin
    restart: unless-stopped

    ports:
      - "8080:80"
    environment:
      - PMA_HOST=${MYSQL_HOST}
      - PMA_PORT=3306
      - PMA_USER=${MYSQL_USER}
      - PMA_PASSWORD=${MYSQL_PASSWORD}
      - PMA_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}

#    depends_on:
##      mysql:
##        condition: service_healthy
    networks:
      - internal_net

  redis:
    container_name: oufoodweb_redis
    image: redis:7
    restart: unless-stopped
    networks:
      - internal_net


