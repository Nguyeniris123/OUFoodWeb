{% extends 'manager/layout/base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Doanh thu theo tháng</h2>

    <!-- TAB -->
    <div class="mb-4">
        <a href="{{ url_for('revenue_weekly') }}" class="btn btn-outline-primary">Theo tuần</a>
        <a href="{{ url_for('revenue_monthly') }}" class="btn btn-primary">Theo tháng</a>
        <a href="{{ url_for('revenue_yearly') }}" class="btn btn-outline-primary">Theo năm</a>
    </div>

    <!-- FORM -->
    <form method="get" class="row g-2 mb-4">
        <div class="col-auto">
            <select name="month" class="form-select">
                {% for m in range(1,13) %}
                <option value="{{ m }}" {% if m == selected_month %}selected{% endif %}>
                    Tháng {{ m }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="col-auto">
            <input type="number" name="year" class="form-control" value="{{ selected_year }}">
        </div>
        <div class="col-auto">
            <button class="btn btn-success">Xem</button>
        </div>
    </form>

    <div style="height:400px">
        <canvas id="monthlyChart"></canvas>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
new Chart(document.getElementById('monthlyChart'), {
    type: 'bar',
    data: {
        labels: {{ labels | tojson }},
        datasets: [{
            label: 'Doanh thu (VND)',
            data: {{ data | tojson }},
            backgroundColor: '#198754'
        }]
    },
    options: {
        scales: {
            y: {
                beginAtZero: true,
                ticks: {
                    callback: v => v.toLocaleString('vi-VN') + ' ₫'
                }
            }
        }
    }
});
</script>
{% endblock %}
